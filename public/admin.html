<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 · 이로운태권도 × 씽크짐</title><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/admin.css"></head><body><header><a class="logo" href="/">이로운태권도 × THINK GYM</a><span class="pill">관리자</span></header><main class="admin-main"><section id="login-panel" class="admin-panel"><p class="eyebrow">ADMINISTRATOR</p><h1>관리자 로그인</h1><p class="description">아이들의 도전 기록과 순위를 관리합니다.</p><form id="login-form"><label for="username">아이디</label><input id="username" name="username" value="tpdhslaek" autocomplete="username" required><label for="password">비밀번호</label><input id="password" name="password" type="password" placeholder="비밀번호를 직접 입력해 주세요" autocomplete="current-password" required maxlength="128"><button class="gold-button" type="submit">로그인</button></form></section><section id="dashboard" hidden><div class="admin-heading"><div><p class="eyebrow">RECORDS & RANKINGS</p><h1>우리 아이들의 도전 기록</h1></div><button id="logout">로그아웃</button></div><div id="totals" class="total-cards"></div><div class="admin-toolbar"><label>프로그램 <select id="program"><option value="pumpkin">유아 5·6세 · 호박 표정</option><option value="rings">유아 7세 · 색 조합</option><option value="shape7">초등 저학년 · 도형 합치기</option><option value="upper">초등 고학년 · 네 방향 퍼즐</option><option value="packing">초등 고학년 · 25칸 조각 채우기</option></select></label><button id="refresh">새로고침</button><button id="reset" class="danger">전체 순위 초기화</button></div><p class="description">개별 삭제는 선택한 기록 한 건에 적용됩니다. 전체 초기화는 모든 프로그램의 완료 기록을 모두 삭제합니다.</p><div id="records" class="records" aria-busy="false"></div><div class="pagination"><button id="previous">이전 50개</button><span id="page-label"></span><button id="next">다음 50개</button></div></section><p id="message" role="status" aria-live="polite"></p></main><dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-detail"></p><label id="confirm-label" hidden>확인을 위해 ‘전체 초기화’를 입력해 주세요<input id="confirm-input" autocomplete="off"></label><div class="dialog-actions"><button value="cancel">취소</button><button id="confirm-submit" class="danger" value="confirm">삭제</button></div></form></dialog><script type="module" src="/admin.js"></script><script type="module" src="/sound.js?v=admin-music-1"></script></body></html>
